<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rhymitty - Поиск рифм</title>
		<link rel="stylesheet" href="style.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
		/>
		<!-- Для иконок -->
	</head>
	<body class="">
		<!-- Класс для темы будет добавляться JS -->

		<div class="container">
			<aside class="sidebar">
				<h1 class="logo">Rhymitty</h1>

				<div class="sidebar-section">
					<h2><i class="fas fa-search"></i> Поиск</h2>
					<input
						type="text"
						id="search-input"
						placeholder="Рифма (оеа, пера...)"
					/>
					<div class="search-options">
						<label>
							<input type="radio" name="search-type" value="vowels" checked />
							Гласные
						</label>
						<label>
							<input type="radio" name="search-type" value="syllables" />
							Слоги/Буквы
						</label>
						<label>
							<input type="checkbox" id="fuzzy-search" /> Неточный поиск (о~ё,
							а~я...)
						</label>
					</div>
					<button id="search-button" class="btn">
						<i class="fas fa-search"></i> Найти
					</button>
				</div>

				<div class="sidebar-section">
					<h2>
						<i class="fas fa-list-ul"></i> Совпадения (<span id="match-count"
							>0</span
						>)
					</h2>
					<ul id="match-list">
						<!-- Ссылки на совпадения будут здесь -->
					</ul>
				</div>

				<div class="sidebar-section">
					<h2><i class="fas fa-history"></i> История текста</h2>
					<div class="history-controls">
						<button id="undo-btn" class="btn" title="Отменить" disabled>
							<i class="fas fa-undo"></i>
						</button>
						<button id="redo-btn" class="btn" title="Вернуть" disabled>
							<i class="fas fa-redo"></i>
						</button>
					</div>
				</div>

				<div class="sidebar-section theme-switcher">
					<h2><i class="fas fa-palette"></i> Тема</h2>
					<button id="theme-toggle" class="btn">
						<i class="fas fa-sun"></i> / <i class="fas fa-moon"></i>
					</button>
				</div>
			</aside>

			<main class="main-content">
				<div id="editor-container">
					<!-- Используем contenteditable div для подсветки -->
					<div
						id="text-editor"
						contenteditable="true"
						spellcheck="false"
						placeholder="Вставьте или напишите свой текст здесь..."
					></div>
					<!-- Скрытое поле для сохранения чистого текста (опционально, но может помочь) -->
					<!-- <textarea id="raw-text-area" style="display:none;"></textarea> -->
				</div>
			</main>
		</div>

		<script src="script.js"></script>
	</body>
</html>
